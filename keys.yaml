# Note that the space after the colon is important in YAML
word_index: word_index.xml
dir: xml
default_page_lang: cy
random_word_on: True
regex_on: False
regex_tickbox: True
xslt_default: entry.xsl
xslt_alt: entry_alt.xsl
xslt_alt_on: False
xslt_alt_enabled: True
search_langs: ['cy' ,'en' ,'la']
interface_langs: ['cy' ,'en' ,'la', 'da']
data_lang: cy
current_lang_label: True

cy:
  # Constants
  not_found: Ni chafwyd yn y geiriadur. Chwiliwch eto.
