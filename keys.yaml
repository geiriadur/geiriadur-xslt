  lang_results_msg: Canlyniadau ar gyfer chwiliad {results_lang_name}
  lang1: cy
  lang1_name: Cymraeg
  lang2: en
  lang2_name: Saesneg
  lang3: la
  lang3_name: Lladin
  lang4: da
  lang4_name: Daneg
  search_msg: chwiliad
  regex_msg: mynegiad rheolaidd
  search_button_name: Chwilio
  page_title: Geiriadur Cymraeg
  regex_label: Mynegiad rheolaidd
  xslt_alt_label: Golwg uwch

  # Won't normally work in the data language
  # unless the code is modified because
  # it only works in the <translation> field
  #stopwords: ["", "", "", ""]

  tkeys:
